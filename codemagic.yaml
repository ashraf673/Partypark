workflows:
  android-workflow:
    name: Partypark Android
    max_build_duration: 60
    environment:
      android_signing:
        - partypark_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.partypark.app"
        GOOGLE_PLAY_TRACK: internal
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: false